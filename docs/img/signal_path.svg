<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <title>NAMberry signal path</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f4f9c"/></marker>
  </defs>
  <rect width="960" height="330" rx="14" fill="#f4f6fb" stroke="#d5dbea"/>
  <g stroke="#2f4f9c" stroke-width="3" fill="none">
    <line x1="150" y1="110" x2="178" y2="110" marker-end="url(#a)"/>
    <line x1="310" y1="110" x2="338" y2="110" marker-end="url(#a)"/>
    <line x1="600" y1="110" x2="628" y2="110" marker-end="url(#a)"/>
    <line x1="760" y1="110" x2="788" y2="110" marker-end="url(#a)"/>
    <line x1="470" y1="170" x2="470" y2="224" marker-start="url(#a)" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle" fill="#1b2a4a">
    <rect x="30" y="70" width="120" height="80" rx="10" fill="#ffffff" stroke="#2b8fd0" stroke-width="2"/>
    <text x="90" y="105" font-size="22" font-weight="700">Guitar</text>
    <text x="90" y="130" font-size="14" fill="#4a5878">instrument level</text>

    <rect x="180" y="70" width="130" height="80" rx="10" fill="#ffffff" stroke="#2b8fd0" stroke-width="2"/>
    <text x="245" y="105" font-size="22" font-weight="700">Pisound</text>
    <text x="245" y="130" font-size="14" fill="#4a5878">audio in</text>

    <rect x="340" y="40" width="260" height="130" rx="12" fill="#ffffff" stroke="#e8174f" stroke-width="3"/>
    <text x="470" y="75" font-size="22" font-weight="700">Raspberry Pi 5</text>
    <text x="470" y="100" font-size="16" fill="#e8174f" font-weight="600">Circle, bare metal (no Linux)</text>
    <text x="470" y="128" font-size="15" fill="#4a5878">NAM captures, effects,</text>
    <text x="470" y="148" font-size="15" fill="#4a5878">cabinet IRs, pedalboard</text>

    <rect x="630" y="70" width="130" height="80" rx="10" fill="#ffffff" stroke="#2b8fd0" stroke-width="2"/>
    <text x="695" y="105" font-size="22" font-weight="700">Pisound</text>
    <text x="695" y="130" font-size="14" fill="#4a5878">audio out</text>

    <rect x="790" y="70" width="140" height="80" rx="10" fill="#ffffff" stroke="#2b8fd0" stroke-width="2"/>
    <text x="860" y="100" font-size="19" font-weight="700">Amp, mixer</text>
    <text x="860" y="125" font-size="19" font-weight="700">or phones</text>

    <rect x="270" y="226" width="400" height="76" rx="10" fill="#ffffff" stroke="#2f4f9c" stroke-width="2"/>
    <text x="470" y="257" font-size="19" font-weight="700">Phone or PC browser</text>
    <text x="470" y="282" font-size="15" fill="#4a5878">web page over Wi-Fi: presets, controls, meters</text>
  </g>
</svg>
